name: VAIXLNS Core External Integration Boundary

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Boundary tests
        run: python -m unittest discover -s tests -p 'test_external_integration_gate.py'
